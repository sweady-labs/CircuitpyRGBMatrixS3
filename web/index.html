<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>LED-Matrix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d0f14'/%3E%3Cg fill='%23ffb000'%3E%3Ccircle cx='4' cy='5' r='1.3'/%3E%3Ccircle cx='8' cy='5' r='1.3'/%3E%3Ccircle cx='12' cy='5' r='1.3'/%3E%3Ccircle cx='4' cy='11' r='1.3'/%3E%3Ccircle cx='12' cy='11' r='1.3'/%3E%3C/g%3E%3Ccircle cx='8' cy='11' r='1.3' fill='%23ff4d6d'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0d0f14;
  --card: #151821;
  --card-2: #1c2030;
  --line: #262b3a;
  --text: #eef0f6;
  --muted: #8b92a6;
  --accent: #ffb000;
  --accent-ink: #1a1200;
  --ok: #3ddc84;
  --bad: #ff5a5a;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f4f8;
    --card: #ffffff;
    --card-2: #f0f2f7;
    --line: #e1e4ec;
    --text: #151821;
    --muted: #646b80;
    --accent: #e69500;
    --accent-ink: #ffffff;
    --shadow: 0 10px 30px rgba(20, 24, 40, .08);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 0 16px calc(28px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* --- Layout --- */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  max-width: 1120px; margin: 0 auto; padding: 14px 0 12px;
  background: linear-gradient(var(--bg) 70%, transparent);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand svg { flex: none; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
  color: var(--muted); font-size: 13px; white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.online .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.pill.offline .dot { background: var(--bad); }
.power {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--card); display: grid; place-items: center; transition: .2s;
}
.power.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 18px rgba(255, 176, 0, .45); }
main {
  max-width: 1120px; margin: 0 auto;
  display: grid; gap: 16px; grid-template-columns: 1fr;
}
/* on a phone the cards form one column: live picture first, then the scenes */
.side, .content { display: contents; }
#card-live { order: 1; }
#card-scenes { order: 2; }
#card-message { order: 3; }
#card-auto { order: 4; }
#card-night { order: 5; }
@media (min-width: 900px) {
  main { grid-template-columns: 420px 1fr; align-items: start; }
  .side, .content { display: grid; gap: 16px; min-width: 0; }
  .side { position: sticky; top: 70px; }
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); min-width: 0;
}
.card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card h2 .hint { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
.muted { color: var(--muted); }

/* --- Live --- */
.screen {
  position: relative; border-radius: 12px; overflow: hidden; background: #050507;
  border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .04);
  aspect-ratio: 2 / 1;
}
.screen canvas { display: block; width: 100%; height: 100%; }
.screen .off {
  position: absolute; inset: 0; display: none; place-items: center; color: #6b7080; font-size: 14px;
}
.screen.dark .off { display: grid; }
.now { display: flex; align-items: center; gap: 10px; margin: 14px 2px 4px; min-height: 28px; }
.now strong { font-size: 18px; }
.chip {
  display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; white-space: nowrap;
}
.chip.warn { color: #ff9f9f; border-color: rgba(255, 90, 90, .4); }
.chip.night { color: #b9b0ff; border-color: rgba(140, 120, 255, .45); }
.controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.round {
  width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card-2); display: grid; place-items: center; transition: transform .1s;
}
.round:active { transform: scale(.94); }
.slider { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.slider output { width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }

/* --- Scenes --- */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 0 -2px 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button {
  flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--muted); font-size: 13.5px;
}
.filters button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
.tile {
  position: relative; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  background: var(--card-2); text-align: left; transition: transform .12s, border-color .2s, box-shadow .2s;
}
.tile:hover { transform: translateY(-1px); border-color: #3a4155; }
.tile:active { transform: scale(.98); }
.thumb {
  position: relative; aspect-ratio: 2 / 1; background-color: #050507;
  background-repeat: no-repeat; image-rendering: pixelated;
}
.thumb::after {
  /* LED grid over the picture */
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle, transparent 42%, rgba(5, 5, 7, .78) 62%);
  background-size: calc(100% / 64) calc(100% / 32);
}
.tile span { display: block; padding: 7px 10px 8px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 22px rgba(255, 176, 0, .18); }
.tile.active span::before { content: "● "; color: var(--accent); }
.tile.busy::before {
  content: ""; position: absolute; z-index: 1; top: 8px; right: 8px; width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .35); border-top-color: var(--accent); animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --- Forms --- */
textarea {
  width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card-2); outline: none;
}
textarea:focus { border-color: var(--accent); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.row label.cap { color: var(--muted); font-size: 13px; min-width: 64px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25);
}
.swatch.active { border-color: var(--text); }
.swatch.bunt { background: conic-gradient(#ff4d4d, #ffb000, #3ddc84, #2bb3ff, #a66bff, #ff4d9d, #ff4d4d); }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.segmented button { padding: 6px 11px; border: 0; background: var(--card-2); color: var(--muted); font-size: 13px; }
.segmented button + button { border-left: 1px solid var(--line); }
.segmented button.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary {
  margin-left: auto; padding: 9px 16px; border-radius: 10px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 650;
}
.primary:disabled { opacity: .5; }
.counter { font-size: 12px; color: var(--muted); }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch i {
  position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: .2s; pointer-events: none;
}
.switch i::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
}
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.toggle-row { display: flex; align-items: center; gap: 12px; }
.toggle-row .text { flex: 1; }
.toggle-row .text small { display: block; color: var(--muted); font-size: 12.5px; }
select, input[type=time] {
  padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card-2);
}
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.picks button {
  padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card-2);
  color: var(--muted); font-size: 13px;
}
.picks button.on { color: var(--text); border-color: var(--accent); background: rgba(255, 176, 0, .12); }
.disabled { opacity: .45; pointer-events: none; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 12px; }
footer { max-width: 1120px; margin: 18px auto 0; color: var(--muted); font-size: 12.5px; text-align: center; }
footer code { font-size: 12px; }

/* --- Toast --- */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
  opacity: 0; transition: .25s; pointer-events: none; z-index: 10; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect width="26" height="26" rx="7" fill="#151821" stroke="#262b3a"/>
      <g fill="#ffb000"><circle cx="7" cy="9" r="2"/><circle cx="13" cy="9" r="2"/><circle cx="19" cy="9" r="2"/><circle cx="7" cy="17" r="2"/><circle cx="19" cy="17" r="2"/></g>
      <circle cx="13" cy="17" r="2" fill="#ff4d6d"/>
    </svg>
    LED-Matrix
  </div>
  <div class="spacer"></div>
  <span class="pill" id="status"><span class="dot"></span><span id="status-text">verbinde …</span></span>
  <button class="power" id="power" aria-label="Matrix ein- oder ausschalten" title="Ein / Aus">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
  </button>
</header>

<main>
  <div class="side">
    <section class="card" id="card-live" aria-label="Gerade läuft">
      <div class="screen" id="screen">
        <canvas id="live" width="640" height="320" aria-label="Live-Bild der Matrix"></canvas>
        <div class="off">Matrix ist aus</div>
      </div>
      <div class="now">
        <strong id="now-title">–</strong>
        <span class="chip" id="now-group"></span>
        <span class="spacer"></span>
        <span class="chip night" id="night-chip" hidden></span>
        <span class="chip warn" id="error-chip" hidden>Fehler</span>
      </div>
      <div class="controls">
        <button class="round" id="prev" aria-label="Vorherige Szene" title="Vorherige Szene">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="slider">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" class="muted"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <input type="range" id="brightness" min="1" max="100" value="60" aria-label="Helligkeit">
          <output id="brightness-out">60 %</output>
        </div>
        <button class="round" id="next" aria-label="Nächste Szene" title="Nächste Szene">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

    <section class="card" id="card-message" aria-labelledby="msg-h">
      <h2 id="msg-h">Laufschrift <span class="hint counter" id="msg-count">0/200</span></h2>
      <textarea id="msg-text" maxlength="200" placeholder="Was soll auf der Matrix stehen?"></textarea>
      <div class="row">
        <label class="cap">Farbe</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="row">
        <label class="cap">Tempo</label>
        <div class="segmented" id="speed"></div>
        <button class="primary" id="msg-send">Anzeigen</button>
      </div>
    </section>
  </div>

  <div class="content">
    <section class="card" id="card-scenes" aria-labelledby="scenes-h">
      <h2 id="scenes-h">Szenen <span class="hint" id="scene-count"></span></h2>
      <div class="filters" id="filters" role="tablist"></div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="card" id="card-auto" aria-labelledby="auto-h">
      <div class="toggle-row">
        <div class="text">
          <h2 id="auto-h" style="margin:0">Automatisch wechseln</h2>
          <small id="auto-sub">Die gewählten Szenen wechseln sich ab.</small>
        </div>
        <label class="switch"><input type="checkbox" id="auto-on" aria-label="Automatisch wechseln"><i></i></label>
      </div>
      <div id="auto-body">
        <div class="row">
          <label class="cap" for="auto-min">Alle</label>
          <select id="auto-min"></select>
          <span class="spacer"></span>
          <button class="chip" id="auto-all" type="button">alle</button>
          <button class="chip" id="auto-none" type="button">keine</button>
        </div>
        <div class="picks" id="picks"></div>
      </div>
    </section>

    <section class="card" id="card-night" aria-labelledby="night-h">
      <div class="toggle-row">
        <div class="text">
          <h2 id="night-h" style="margin:0">Nachtmodus</h2>
          <small>Nachts dunkler oder ganz aus.</small>
        </div>
        <label class="switch"><input type="checkbox" id="night-on" aria-label="Nachtmodus"><i></i></label>
      </div>
      <div id="night-body">
        <div class="row">
          <label class="cap" for="night-start">Von</label>
          <input type="time" id="night-start" value="22:30">
          <label class="cap" for="night-end" style="min-width:auto">bis</label>
          <input type="time" id="night-end" value="06:30">
        </div>
        <div class="row">
          <label class="cap" for="night-level">Nachts</label>
          <div class="slider">
            <input type="range" id="night-level" min="0" max="50" value="0" aria-label="Helligkeit nachts">
            <output id="night-out">aus</output>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer id="info">ledmatrix.local</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const COLORS = [["#FFB000", "Bernstein"], ["#FF4D4D", "Rot"], ["#3DDC84", "Grün"], ["#2BB3FF", "Blau"],
                ["#A66BFF", "Lila"], ["#FF5FA2", "Pink"], ["#FFFFFF", "Weiß"], ["bunt", "Bunt"]];
const SPEEDS = [[1, "Langsam"], [2, "·"], [3, "Mittel"], [4, "·"], [5, "Schnell"]];
const MINUTES = [1, 2, 5, 10, 15, 30, 60, 120];
const GROUP_ORDER = ["Info", "Stimmung", "Effekte", "Spiele", "Helden", "Weihnachten"];

let scenes = [];          // [{id, title, group}]
let state = null;         // last /api/state
let filter = localStorageGet("filter") || "Alle";
let online = false;
let message = {text: "", color: "#FFB000", speed: 3};
let liveBusy = false;

function localStorageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function localStorageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode */ } }

// --- Network ---------------------------------------------------------------------------

async function api(path, body) {
  const options = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error((data.rejected || []).join(", ") || response.status);
  setOnline(true);
  if (data && data.scene !== undefined) apply(data);
  return data;
}

async function act(path, body, okText) {
  try {
    await api(path, body);
    if (okText) toast(okText);
  } catch (e) {
    toast("Das hat nicht geklappt" + (e.message ? " (" + e.message + ")" : ""));
    refresh();
  }
}

function setOnline(value) {
  if (online === value) return;
  online = value;
  $("status").className = "pill " + (value ? "online" : "offline");
  $("status-text").textContent = value ? (state && state.time ? state.time : "verbunden") : "keine Verbindung";
}

async function refresh() {
  try { await api("/api/state"); } catch (e) { setOnline(false); }
}

// --- State -> page ----------------------------------------------------------------------

function apply(s) {
  state = s;
  $("status-text").textContent = s.time || "verbunden";
  $("power").classList.toggle("on", s.on);
  $("power").setAttribute("aria-pressed", s.on ? "true" : "false");
  $("screen").classList.toggle("dark", !s.level);

  const scene = scenes.find((x) => x.id === s.scene);
  $("now-title").textContent = scene ? scene.title : s.scene;
  $("now-group").textContent = scene ? scene.group : "";
  $("error-chip").hidden = !s.error;
  $("error-chip").title = s.error || "";
  $("night-chip").hidden = !s.night_active;
  $("night-chip").textContent = s.night.level ? "Nachtmodus · " + s.night.level + " %" : "Nachtmodus · aus";

  if (!document.activeElement || document.activeElement.id !== "brightness") {
    $("brightness").value = s.brightness;
    $("brightness-out").textContent = s.brightness + " %";
  }
  document.querySelectorAll(".tile").forEach((t) => {
    t.classList.toggle("active", t.dataset.id === s.scene);
    if (t.dataset.id === s.scene) t.classList.remove("busy");
  });

  // playlist
  $("auto-on").checked = s.playlist.on;
  $("auto-body").classList.toggle("disabled", !s.playlist.on);
  $("auto-min").value = s.playlist.minutes;
  const chosen = new Set(s.playlist.scenes);
  document.querySelectorAll("#picks button").forEach((b) => b.classList.toggle("on", chosen.has(b.dataset.id)));
  $("auto-sub").textContent = s.playlist.on
    ? s.playlist.scenes.length + " Szenen, alle " + minutesText(s.playlist.minutes)
    : "Die gewählten Szenen wechseln sich ab.";

  // night mode
  $("night-on").checked = s.night.on;
  $("night-body").classList.toggle("disabled", !s.night.on);
  if (document.activeElement !== $("night-start")) $("night-start").value = s.night.start;
  if (document.activeElement !== $("night-end")) $("night-end").value = s.night.end;
  if (document.activeElement !== $("night-level")) {
    $("night-level").value = s.night.level;
    $("night-out").textContent = s.night.level ? s.night.level + " %" : "aus";
  }

  // message: take over what the matrix has, unless the user is changing it
  if (document.activeElement !== $("msg-text") && !$("msg-text").dataset.dirty
      && JSON.stringify(s.message) !== JSON.stringify(message)) {
    message = Object.assign({}, s.message);
    $("msg-text").value = message.text;
    countChars();
    renderSwatches();
    renderSpeeds();
  }

  $("info").innerHTML = "<code>ledmatrix.local</code> · " + (s.free_kb / 1024).toFixed(1).replace(".", ",") + " MB frei · läuft seit "
    + uptimeText(s.uptime_s) + (s.level ? " · " + Math.round(s.fps) + " Bilder/s" : "");
}

function minutesText(m) { return m < 60 ? m + " Min." : (m / 60) + " Std."; }
function uptimeText(s) {
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " Min.";
  if (s < 172800) return Math.round(s / 3600) + " Std.";
  return Math.round(s / 86400) + " Tagen";
}

// --- Scenes -----------------------------------------------------------------------------

function renderFilters() {
  const groups = ["Alle"].concat(GROUP_ORDER.filter((g) => scenes.some((s) => s.group === g)));
  if (!groups.includes(filter)) filter = "Alle";
  $("filters").innerHTML = "";
  for (const g of groups) {
    const b = document.createElement("button");
    b.textContent = g;
    b.setAttribute("role", "tab");
    b.classList.toggle("active", g === filter);
    b.setAttribute("aria-selected", g === filter ? "true" : "false");
    b.onclick = () => { filter = g; localStorageSet("filter", g); renderFilters(); renderGrid(); };
    $("filters").appendChild(b);
  }
}

function renderGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  const shown = scenes.filter((s) => filter === "Alle" || s.group === filter);
  $("scene-count").textContent = shown.length + " von " + scenes.length;
  shown.forEach((s) => {
    const index = scenes.indexOf(s);
    const tile = document.createElement("button");
    tile.className = "tile";
    tile.dataset.id = s.id;
    tile.title = s.title + " anzeigen";
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.style.backgroundImage = "url(vorschau.png?n=" + scenes.length + ")";
    thumb.style.backgroundSize = "100% " + (scenes.length * 100) + "%";
    thumb.style.backgroundPosition = "0 " + (scenes.length > 1 ? index / (scenes.length - 1) * 100 : 0) + "%";
    const label = document.createElement("span");
    label.textContent = s.title;
    tile.append(thumb, label);
    tile.onclick = () => {
      if (state && state.scene === s.id) return;
      tile.classList.add("busy");
      act("/api/scene", {id: s.id});
    };
    grid.appendChild(tile);
  });
  if (state) apply(state);
}

function renderPicks() {
  const picks = $("picks");
  picks.innerHTML = "";
  for (const s of scenes) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.id = s.id;
    b.textContent = s.title;
    b.onclick = () => {
      b.classList.toggle("on");
      savePlaylist();
    };
    picks.appendChild(b);
  }
}

let playlistTimer = null;
function savePlaylist() {
  clearTimeout(playlistTimer);
  playlistTimer = setTimeout(() => {
    const chosen = [...document.querySelectorAll("#picks button.on")].map((b) => b.dataset.id);
    act("/api/settings", {playlist: {on: $("auto-on").checked, minutes: +$("auto-min").value, scenes: chosen}});
  }, 500);
}

// --- Message ----------------------------------------------------------------------------

function renderSwatches() {
  const box = $("swatches");
  box.innerHTML = "";
  for (const [color, name] of COLORS) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch" + (color === "bunt" ? " bunt" : "");
    if (color !== "bunt") b.style.background = color;
    b.title = name;
    b.setAttribute("aria-label", "Farbe " + name);
    b.classList.toggle("active", message.color.toUpperCase() === color.toUpperCase());
    b.onclick = () => { message.color = color; markDirty(); renderSwatches(); };
    box.appendChild(b);
  }
}

function renderSpeeds() {
  const box = $("speed");
  box.innerHTML = "";
  for (const [value, name] of SPEEDS) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.title = "Tempo " + value;
    b.classList.toggle("active", message.speed === value);
    b.onclick = () => { message.speed = value; markDirty(); renderSpeeds(); };
    box.appendChild(b);
  }
}

function markDirty() { $("msg-text").dataset.dirty = "1"; }
function countChars() {
  $("msg-count").textContent = $("msg-text").value.length + "/200";
  $("msg-send").disabled = !$("msg-text").value.trim();
}

async function sendMessage() {
  const text = $("msg-text").value.trim();
  if (!text) return;
  $("msg-send").disabled = true;
  delete $("msg-text").dataset.dirty;
  await act("/api/message", {text: text, color: message.color, speed: message.speed}, "Läuft auf der Matrix");
  $("msg-send").disabled = false;
}

// --- Live picture -----------------------------------------------------------------------

const canvas = $("live");
const ctx = canvas.getContext("2d");
const LEVELS5 = new Float32Array(32);  // red and blue have 5 bits on the matrix
const LEVELS6 = new Float32Array(64);  // green has 6 bits

function sizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const width = Math.round(canvas.clientWidth * ratio);
  if (width && canvas.width !== width) {
    canvas.width = width;
    canvas.height = Math.round(width / 2);
  }
}

function drawFrame(bytes) {
  sizeCanvas();
  const w = canvas.width, h = canvas.height, cell = w / 64, r = cell * 0.42;
  ctx.fillStyle = "#050507";
  ctx.fillRect(0, 0, w, h);
  // the matrix shows its colors dimmed to the brightness; brighten the picture back for the eye
  const level = state && state.level ? state.level / 100 : 1;
  const gain = 1 / Math.max(level, 0.05);
  for (let i = 0; i < 32; i++) LEVELS5[i] = 255 * Math.pow(Math.min(1, (i / 31) * gain), 1 / 2.2);
  for (let i = 0; i < 64; i++) LEVELS6[i] = 255 * Math.pow(Math.min(1, (i / 63) * gain), 1 / 2.2);
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 64; x++) {
      const k = (y * 64 + x) * 2;
      const v = bytes[k] | (bytes[k + 1] << 8);  // RGB565, little endian
      if (!v) continue;
      ctx.fillStyle = "rgb(" + (LEVELS5[v >> 11] | 0) + "," + (LEVELS6[(v >> 5) & 63] | 0) + "," + (LEVELS5[v & 31] | 0) + ")";
      ctx.beginPath();
      ctx.arc((x + 0.5) * cell, (y + 0.5) * cell, r, 0, 6.2832);
      ctx.fill();
    }
  }
}

async function live() {
  if (!document.hidden && online && !liveBusy && state && state.level) {
    liveBusy = true;
    try {
      const response = await fetch("/api/frame", {cache: "no-store"});
      if (response.ok) drawFrame(new Uint8Array(await response.arrayBuffer()));
    } catch (e) { /* next try */ }
    liveBusy = false;
  }
  setTimeout(live, 300);
}

// --- Toast ------------------------------------------------------------------------------

let toastTimer = null;
function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2600);
}

// --- Wiring -----------------------------------------------------------------------------

let brightnessTimer = null;
$("brightness").addEventListener("input", (e) => {
  $("brightness-out").textContent = e.target.value + " %";
  clearTimeout(brightnessTimer);
  brightnessTimer = setTimeout(() => act("/api/settings", {brightness: +e.target.value}), 150);
});
$("power").onclick = () => act("/api/settings", {on: !(state && state.on)});
$("prev").onclick = () => act("/api/scene", {step: -1});
$("next").onclick = () => act("/api/scene", {step: 1});
$("msg-text").addEventListener("input", () => { markDirty(); countChars(); });
$("msg-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$("msg-send").onclick = sendMessage;
$("auto-on").onchange = savePlaylist;
$("auto-min").onchange = savePlaylist;
$("auto-all").onclick = () => { document.querySelectorAll("#picks button").forEach((b) => b.classList.add("on")); savePlaylist(); };
$("auto-none").onclick = () => { document.querySelectorAll("#picks button").forEach((b) => b.classList.remove("on")); savePlaylist(); };
for (const m of MINUTES) {
  const option = document.createElement("option");
  option.value = m;
  option.textContent = minutesText(m);
  $("auto-min").appendChild(option);
}

let nightTimer = null;
function saveNight() {
  clearTimeout(nightTimer);
  nightTimer = setTimeout(() => act("/api/settings", {night: {
    on: $("night-on").checked, start: $("night-start").value, end: $("night-end").value, level: +$("night-level").value,
  }}), 400);
}
$("night-on").onchange = saveNight;
$("night-start").onchange = saveNight;
$("night-end").onchange = saveNight;
$("night-level").addEventListener("input", (e) => {
  $("night-out").textContent = +e.target.value ? e.target.value + " %" : "aus";
  saveNight();
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
window.addEventListener("resize", sizeCanvas);

async function start() {
  renderSwatches();
  renderSpeeds();
  try {
    scenes = await (await fetch("/api/scenes")).json();
  } catch (e) {
    setOnline(false);
    setTimeout(start, 3000);
    return;
  }
  renderFilters();
  renderGrid();
  renderPicks();
  await refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 4000);
  live();
}
start();
</script>
</body>
