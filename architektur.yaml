# Selbstbeschreibung für das zentrale Architekturmodell (sweady-labs/systemarchitektur).
# Beim Ändern der Architektur hier mitpflegen — die CI sammelt diese Datei nächtlich ein.

name: CircuitpyRGBMatrixS3
zweck: CircuitPython-Firmware fuer ein Adafruit MatrixPortal S3 im Flur. Spielt auf einer 64x32-HUB75-LED-Matrix
  Szenen ab (Uhr, Laufschrift, Hub-Status, Effekte, Spiele, Weihnachten), bedienbar ueber ein Webinterface und
  eine JSON-API im WLAN; mit automatischem Szenenwechsel, Nachtmodus und Uhrzeit per NTP (KAN-502).
system: led-matrix
status: aktiv
laeuft_auf:
- matrixportal
bietet_an:
- name: Webinterface LED-Matrix
  art: webseite
  zweck: 'Bedienung im WLAN: Live-Bild der Matrix, Szenen waehlen, Helligkeit, Laufschrift, automatischer Wechsel,
    Nachtmodus. Statische Dateien aus /web (web/index.html, web/vorschau.png), Server in code.py:start_network'
  adresse: http://ledmatrix.local/ bzw. http://<geraete-ip>/ (Port 80)
- name: JSON-API /api/*
  art: http-api
  zweck: 'Zustand lesen, Szene wechseln, Einstellungen und Laufschrift setzen, aktuelles Bild als RGB565 (app/web.py).
    Gedacht fuer das Webinterface und fuer Kurzbefehle im Heimnetz (Siri, n8n); ohne Anmeldung.'
  adresse: 'http://ledmatrix.local/api/state, /api/scenes, /api/frame (GET); /api/scene, /api/settings, /api/message
    (POST)'
nutzt:
- ziel: home-hub
  was: /api/zusammenfassung
  art: http
  zweck: 'Die Szene hub_status fragt alle 60 s den Gesamtstatus ab und zeigt drei Zeilen: Internet, Backup und
    Hinweise. Die Matrix holt selbst, der Hub schickt nichts. Optional mit Bearer-Token (KAN-19)'
  beleg: scenes/hub_status.py (HUB_URL und HUB_API_TOKEN aus settings.toml), Anzeige in app/hub_lines.py
daten:
- was: WLAN-Zugangsdaten (SSID und Passwort)
  wo: /settings.toml auf dem Geraet, im Repo nur Platzhalter; gelesen beim Start (code.py:start_network)
  schutzbedarf: geheim
- was: Adresse des Home Hubs und optionales API-Token (HUB_URL, HUB_API_TOKEN)
  wo: /settings.toml auf dem Geraet, im Repo nur Platzhalter; gelesen in scenes/hub_status.py
  schutzbedarf: geheim
- was: 'Einstellungen: aktuelle Szene, Helligkeit, Playlist, Nachtmodus und der Text der Laufschrift'
  wo: NVM des Mikrocontrollers als JSON (app/store.py), ueber /api/state fuer jeden im WLAN lesbar
  schutzbedarf: intern
- was: Firmware, Szenen und Webinterface
  wo: Dateisystem des MatrixPortal S3 (code.py, app/, scenes/, web/)
  schutzbedarf: oeffentlich
doku:
- pfad: README.md
  inhalt: Was es kann, Einrichtung, Bedienung, API und Entwicklung
- pfad: scenes/README.md
  inhalt: Wie eine Szene gebaut wird, was Operationen auf dem Geraet kosten, Grenzen von ulab und Co.
